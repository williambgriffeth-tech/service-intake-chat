<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Request Chat</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #0b0b0b;
      color: #fff;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100dvh;
      display: flex;
      align-items: center;
    }

    .card {
      background: #151515;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin: 0 0 8px 0;
    }

    /* iOS SAFE chat window */
    .msgs {
      min-height: 55dvh;
      max-height: 55dvh;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .msg {
      margin: 10px 0;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .me {
      color: #9fd3ff;
    }

    .ai {
      color: #d9ffd9;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #0f0f0f;
      color: #fff;
      font-size: 16px;
    }

    button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      background: #2b6fff;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
    }

    .small {
      opacity: 0.8;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h2>Request Service</h2>

      <div class="msgs" id="msgs"></div>

      <div class="row">
        <input
          id="inp"
          enterkeyhint="send"
          placeholder="Describe the problem (e.g., walk-in not cooling)"
        />
        <button id="send">Send</button>
      </div>

      <div class="small">
        When intake is complete, we automatically send it to dispatch.
      </div>
    </div>
  </div>

<script>
  const msgsEl = document.getElementById("msgs");
  const inp = document.getElementById("inp");
  const sendBtn = document.getElementById("send");

  const messages = [];
  let transcript = "";

  function add(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "me" : "ai");
    div.textContent =
      (role === "user" ? "Customer: " : "Assistant: ") + text;

    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    transcript +=
      (role === "user" ? "Customer: " : "Assistant: ") + text + "\n";
  }

  async function callAI() {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "AI error");

    add("assistant", data.reply || "");
    messages.push({ role: "assistant", content: JSON.stringify(data) });

    if (data.done) {
      const er = await fetch("/api/email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticket: data.ticket, transcript })
      });

      const ed = await er.json();
      if (!er.ok) throw new Error(ed.error || "Email error");
    }
  }

  async function sendMessage() {
    const text = inp.value.trim();
    if (!text) return;

    inp.value = "";
    add("user", text);
    messages.push({ role: "user", content: text });

    sendBtn.disabled = true;
    try {
      await callAI();
    } catch (e) {
      add("assistant", "Sorry — something went wrong. Please try again.");
    } finally {
      sendBtn.disabled = false;
      inp.focus();
    }
  }

  sendBtn.onclick = sendMessage;

  // ENTER KEY = SEND (DESKTOP + MOBILE)
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendBtn.click();
    }
  });

  // Initial message
  add(
    "assistant",
    "I’ll help you submit a service request. What equipment is having the issue?"
  );
</script>
</body>
</html>
